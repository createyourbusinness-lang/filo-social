name: Publish Instagram posts

on:
  schedule:
    # Mondays 08:00 UTC = 09:00 Madrid (winter) / 10:00 (summer)
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due posts
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: "17841427713298035"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/publish.py
      - name: Save published state
        run: |
          git config user.name "filo-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet || (git commit -m "Mark posts as published" && git push)
